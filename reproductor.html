<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vídeo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!-- Reproductor para las ventanas de Ayuda del Geoportal (exb_config.py, _dialogo_video).
     Uso: reproductor.html?v=<url del mp4>. ExB no desmonta la ventana al cerrarla (solo la
     oculta): aqui se pausa el video en cuanto el iframe deja de verse. -->
<video id="v" controls preload="metadata"></video>
<script>
  var v = document.getElementById("v");
  var url = new URLSearchParams(location.search).get("v") || "";
  if (/^https:\/\/sig\.mapama\.gob\.es\//.test(url)) {   // solo videos del MITECO
    v.src = url;
    // Reproduccion automatica; en un iframe de otro dominio el navegador puede
    // bloquearla con sonido: entonces queda en pausa con los controles a la vista.
    var p = v.play();
    if (p && p.catch) { p.catch(function () {}); }
  }
  function pausar() { if (!v.paused) { v.pause(); } }
  // La ventana cerrada deja el iframe con 0 px o fuera de la vista
  addEventListener("resize", function () { if (!innerWidth || !innerHeight) { pausar(); } });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (e) { if (!e[0].isIntersecting) { pausar(); } }).observe(v);
  }
  document.addEventListener("visibilitychange", function () { if (document.hidden) { pausar(); } });
</script>
</body>
</html>
