<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vídeo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { display: block; width: 100%; height: 100%; }
  #play { position: absolute; top: 50%; left: 50%; width: 88px; height: 88px;
          margin: -44px 0 0 -44px; padding: 0; border: 3px solid #fff; border-radius: 50%;
          background: rgba(25, 90, 188, .85); cursor: pointer; }
  #play:hover, #play:focus-visible { background: #195abc; outline: none; }
  #play svg { display: block; width: 36px; height: 36px; margin: 0 auto 0 30px; fill: #fff; }
</style>
</head>
<body>
<!-- Reproductor para las ventanas de Ayuda del Geoportal (exb_config.py, _vista_video).
     Uso: reproductor.html?v=<url del mp4>.
     - No arranca solo: en un iframe de otro dominio (el Embed de ExB no lleva
       allow="autoplay") el navegador no deja sonido sin un clic. Boton ▶ grande: un clic
       y suena desde el principio.
     - ExB no desmonta la ventana al cerrarla (solo la oculta): al dejar de verse se pausa
       y se corta la descarga; al reabrir vuelve el ▶ y se sigue desde el mismo punto. -->
<video id="v" controls preload="metadata" playsinline></video>
<button id="play" type="button" aria-label="Reproducir" title="Reproducir" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l16 9-16 9z"/></svg>
</button>
<script>
  var v = document.getElementById("v");
  var play = document.getElementById("play");
  var url = new URLSearchParams(location.search).get("v") || "";
  var valido = /^https:\/\/sig\.mapama\.gob\.es\//.test(url);   // solo videos del MITECO
  var visible = true, posicion = 0, descargando = false;

  function cargar() {
    if (!valido || descargando) { return; }
    descargando = true;
    v.src = url;
    if (posicion) {
      v.addEventListener("loadedmetadata", function seek() {
        v.removeEventListener("loadedmetadata", seek);
        v.currentTime = posicion;
      });
    }
    play.hidden = false;
  }
  // Quitar la fuente + load() aborta la peticion: corta la descarga
  function cortar() {
    if (!v.paused) { v.pause(); }
    if (!descargando) { return; }
    posicion = v.currentTime || posicion;
    descargando = false;
    v.removeAttribute("src");
    v.load();
  }
  function verse(si) {
    if (si === visible) { return; }
    visible = si;
    if (si) { cargar(); } else { cortar(); }
  }

  play.addEventListener("click", function () {
    var p = v.play();
    if (p && p.catch) { p.catch(function () { play.hidden = false; }); }
  });
  // Tambien vale el play de los controles nativos
  v.addEventListener("play", function () { play.hidden = true; });

  cargar();

  // La ventana cerrada deja el iframe con 0 px o fuera de la vista
  addEventListener("resize", function () { verse(!!(innerWidth && innerHeight)); });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (e) { verse(e[0].isIntersecting); }).observe(v);
  }
  // Pestana del navegador en segundo plano: solo pausa
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && !v.paused) { v.pause(); }
  });
</script>
</body>
</html>
